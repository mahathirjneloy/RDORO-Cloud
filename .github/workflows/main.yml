name: Build Native Windows App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Self-Healing Tree, Clean Rust Backend & Version Sync
        shell: powershell
        run: |
          Write-Host "Cleaning repository and syncing configurations..." -ForegroundColor Cyan
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          # 1. Guarantee directory hierarchy exists
          $requiredDirs = @("src", "src-tauri", "src-tauri/src", "src-tauri/capabilities")
          foreach ($dir in $requiredDirs) {
            if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
            }
          }

          # 2. Heal root-flattened files if misplaced
          if (Test-Path "main.ts") { Move-Item -Path "main.ts" -Destination "src/main.ts" -Force }
          if (Test-Path "style.css") { Move-Item -Path "style.css" -Destination "src/style.css" -Force }

          # 3. Clean leftover Preact .tsx files in src/
          if (Test-Path "src/components") { Remove-Item "src/components" -Recurse -Force }
          Get-ChildItem -Path "src" -Filter "*.tsx" -Recurse | Remove-Item -Force

          # 4. Purge ALL leftover Rust files (lib.rs, database.rs, tray.rs, notifications.rs, shortcuts.rs)
          Get-ChildItem -Path "src-tauri/src" -Filter "*.rs" -Recurse | Remove-Item -Force

          # 5. Write clean src-tauri/src/main.rs
          $mainRs = @'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          fn main() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("error while running RDORO application");
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/src/main.rs", $mainRs.Trim(), $utf8NoBom)

          # 6. Write clean src-tauri/build.rs
          $buildRs = @'
          fn main() {
              tauri_build::build()
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/build.rs", $buildRs.Trim(), $utf8NoBom)

          # 7. Write clean src-tauri/Cargo.toml
          if (Test-Path "src-tauri/Cargo.lock") {
            Remove-Item "src-tauri/Cargo.lock" -Force
          }
          $cargoToml = @'
          [package]
          name = "rdoro"
          version = "1.0.0"
          description = "RDORO Precision Focus & Study Tracking System"
          authors = ["RDORO"]
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/Cargo.toml", $cargoToml.Trim(), $utf8NoBom)

          # 8. Write clean src-tauri/tauri.conf.json
          $tauriConfJson = @'
          {
            "$schema": "https://raw.githubusercontent.com/tauri-apps/tauri/dev/crates/tauri-cli/schema.json",
            "productName": "RDORO",
            "version": "1.0.0",
            "identifier": "com.rdoro.focusapp",
            "build": {
              "frontendDist": "../dist",
              "devUrl": "http://localhost:1420",
              "beforeDevCommand": "pnpm dev",
              "beforeBuildCommand": "pnpm build"
            },
            "app": {
              "windows": [
                {
                  "title": "RDORO - Focus & Study Chronometer",
                  "width": 960,
                  "height": 720,
                  "minWidth": 800,
                  "minHeight": 620,
                  "resizable": true,
                  "fullscreen": false,
                  "center": true
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": ["nsis", "msi"],
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/tauri.conf.json", $tauriConfJson.Trim(), $utf8NoBom)

          # 9. Write clean src-tauri/capabilities/default.json
          Get-ChildItem -Path "src-tauri/capabilities" -Filter "*.json" -Recurse | Remove-Item -Force
          $capabilityJson = @'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default permissions for RDORO",
            "windows": ["main"],
            "permissions": [
              "core:default"
            ]
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/capabilities/default.json", $capabilityJson.Trim(), $utf8NoBom)

          # 10. Write clean package.json, tsconfig.json, and vite.config.ts
          $packageJson = @'
          {
            "name": "rdoro",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview",
              "tauri": "tauri"
            },
            "dependencies": {
              "@tauri-apps/api": "^2.0.0"
            },
            "devDependencies": {
              "@tauri-apps/cli": "^2.0.0",
              "typescript": "^5.5.0",
              "vite": "^5.4.0"
            }
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/package.json", $packageJson.Trim(), $utf8NoBom)

          $viteConfig = @'
          import { defineConfig } from "vite";

          export default defineConfig({
            clearScreen: false,
            server: {
              port: 1420,
              strictPort: true,
              watch: {
                ignored: ["**/src-tauri/**"]
              }
            },
            build: {
              target: "es2022",
              minify: !process.env.TAURI_DEBUG ? "esbuild" : false,
              sourcemap: !!process.env.TAURI_DEBUG
            }
          });
          '@
          [System.IO.File]::WriteAllText("$PWD/vite.config.ts", $viteConfig.Trim(), $utf8NoBom)

          # 11. Recreate app-icon.svg if missing
          if (-not (Test-Path "app-icon.svg")) {
            $svg = @'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="112" fill="#0c0e12" />
            <circle cx="256" cy="256" r="184" fill="none" stroke="#1c222e" stroke-width="28" />
            <circle cx="256" cy="256" r="184" fill="none" stroke="#10b981" stroke-width="28" stroke-dasharray="867 1156" stroke-linecap="round" transform="rotate(-90 256 256)" />
            <circle cx="256" cy="256" r="132" fill="#14171f" />
            <polygon points="256,160 274,256 256,240 238,256" fill="#10b981" />
            <circle cx="256" cy="256" r="18" fill="#34d399" />
          </svg>
          '@
            [System.IO.File]::WriteAllText("$PWD/app-icon.svg", $svg.Trim(), $utf8NoBom)
          }

      - name: Install Frontend & CLI Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Update Cargo Crates to Match Latest Tauri 2.x
        working-directory: src-tauri
        run: cargo update

      - name: Generate Multi-Resolution App Icons
        run: pnpm tauri icon app-icon.svg

      - name: Compile Windows Native App
        run: pnpm tauri build

      - name: Upload Windows Installers (.exe & .msi)
        uses: actions/upload-artifact@v4
        with:
          name: RDORO-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
